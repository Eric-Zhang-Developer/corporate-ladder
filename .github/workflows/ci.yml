name: CI Checks

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build project
        run: npm run build

      - name: Run Tests
        run: npm test

  # Publishes to GitHub Pages only after the checks above pass, and only for
  # pushes — pull requests build and test but never deploy. A Pages deploy
  # replaces the whole site, so a push to either branch rebuilds both: main
  # at the root, dev under /preview/.
  deploy-pages:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Shared across branches and never cancelled: a main push and a dev push
    # must not race each other to publish the site.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: "main/.nvmrc"
          cache: "npm"
          cache-dependency-path: "*/package-lock.json"

      - name: Build main
        working-directory: main
        run: npm ci && npm run build

      - name: Build dev
        working-directory: dev
        run: npm ci && npm run build

      - name: Nest dev under /preview/
        run: mv dev/dist main/dist/preview

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
